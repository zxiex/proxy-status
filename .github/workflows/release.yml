name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ProxyStatus
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          swift --version
          make --version

      - name: Build distribution
        run: make dist

      - name: Verify distribution
        run: |
          test -f build/ProxyStatus.zip
          unzip -l build/ProxyStatus.zip
          unzip -t build/ProxyStatus.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyStatus-${{ github.sha }}
          path: build/ProxyStatus.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/ProxyStatus.zip \
            --title "ProxyStatus ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
